<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feelify - Log In</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="css/login-style.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="logo-area">
        <div class="logo">Feel<span class="logo-accent">ify</span></div>
        <div class="slogan">Your feelings, your melody.</div>
      </div>
      <div class="spotify-login-only">
        <a href="/login" id="spotify-login-button">
          <i class="fab fa-spotify"></i> Connect With Spotify
        </a>
        <p class="login-note">
          To continue, please connect your Spotify account.
        </p>
      </div>
    </div>
  </body>
</html>
